<style>

nav .brand{display:none;font-size:1.7rem;font-weight:800;letter-spacing:-.03em;margin:0 8px 18px;background:linear-gradient(90deg,var(--c),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}

 if(sb){sb.from('profiles').upsert({id:me.id,nick:me.nick||'Anônimo',avatar:me.av,xp:P.xp}).then(()=>{},()=>{});sb.from('progress').upsert({player_id:me.id,skill:k,correct:s.ok,total:s.n,updated_at:new Date().toISOString()},{onConflict:'player_id,skill'}).then(()=>{},()=>{})}}

/* ===== Gerador de questões (determinístico por semente → todos na sala veem o mesmo) ===== */
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

 const A=[X(30),120],B=[X(190),120],C=[X(190),30],ln=(p,q,k)=>`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" ${s(k)}/>`,

 return `<svg viewBox="0 0 220 150">${ln(A,B,'ad')}${ln(B,C,'op')}${ln(A,C,'hy')}<path d="M${X(190)+(f?12:-12)} 120v-12h${f?-12:12}" fill="none" stroke="#a9b0dc" stroke-width="2"/>${t(X(30)+(f?-32:32),112,'middle','α')}${t(X(110),141,'middle',L.ad)}${t(X(190)+(f?-10:10),80,f?'end':'start',L.op)}${t(X(98),56,'middle',L.hy)}</svg>`}

 if(sk=='lados'){const hl=pick(['ad','op','hy']),N={ad:'cateto adjacente',op:'cateto oposto',hy:'hipotenusa'};
  q={t:'Em relação ao ângulo α, como se chama o lado destacado?',...mk(N[hl],Object.values(N).filter(x=>x!=N[hl]).concat('ângulo reto')),f:fig({hl,flip:R()<.5}),e:'A hipotenusa é oposta ao ângulo reto. O cateto oposto está do lado contrário a α. O cateto adjacente encosta em α.'}}
 else if(sk=='razao'){const r=pick([['sen','oposto','hipotenusa','seno'],['cos','adjacente','hipotenusa','cosseno'],['tan','oposto','adjacente','tangente']]);
  q={t:`Conhecemos o cateto ${r[1]} e ${r[2]=='hipotenusa'?'a hipotenusa':'o cateto adjacente'} em relação ao ângulo α. Qual razão usar?`,...mk(r[3],['seno','cosseno','tangente','teorema de Pitágoras'].filter(x=>x!=r[3]).slice(0,3)),e:`${r[3][0].toUpperCase()+r[3].slice(1)}: ${r[0]} α = ${r[1]} ÷ ${r[2]}. Lembre: SOH-CAH-TOA.`}}
 else if(sk=='calculo'){const [a,b,c]=pick([[3,4,5],[5,12,13],[8,15,17],[6,8,10]]),r=pick(['sen','cos','tan']),F={sen:`${a}/${c}`,cos:`${b}/${c}`,tan:`${a}/${b}`},all=[`${a}/${c}`,`${b}/${c}`,`${a}/${b}`,`${b}/${a}`,`${c}/${a}`].filter(x=>x!=F[r]);
  q={t:`Catetos ${a} e ${b}, hipotenusa ${c}. Se α é o ângulo oposto ao cateto ${a}, quanto vale ${r} α?`,...mk(F[r],sh(all).slice(0,3)),f:fig({lb:{op:a,ad:b,hy:c}}),e:`${r} α = ${{sen:'oposto ÷ hipotenusa',cos:'adjacente ÷ hipotenusa',tan:'oposto ÷ adjacente'}[r]} = ${F[r]}.`}}
 else if(sk=='lado'&&R()<.35){const f=pick(['sen','cos','tan']),a=pick([30,45,60]);
  q={t:`Se ${f} α = ${EX[f][a]}, qual é o ângulo agudo α?`,o:['30°','45°','60°','90°'],a:[30,45,60].indexOf(a),e:`Valor notável: ${f} ${a}° = ${EX[f][a]}.`}}
 else{const prob=sk=='problema',a=pick([30,45,60]),H=pick([4,6,8,10,12]),f=prob?pick(['sen','cos']):pick(['sen','cos']),c=val(f,a,H),h=H/2,

 q.sk=sk;return q}

 const vs=[s,c,t];['s','c','t'].forEach((k,i)=>{$('#v'+k).textContent=vs[i]==null?'indefinida':vs[i].toFixed(3);$('#b'+k).style.width=(vs[i]==null?100:Math.min(vs[i]/(k=='t'?3:1),1)*100)+'%'});
 document.querySelectorAll('.chip[data-d]').forEach(e=>e.classList.toggle('on',+e.dataset.d==d));
 const f=$('#fm');if(f){f.innerHTML=`<div>Imagine hipotenusa = 10 e α = ${d}°</div><div><b>sen</b> ${d}° = oposto ÷ hipotenusa = ${(10*s).toFixed(2)} ÷ 10 = <b>${s.toFixed(3)}</b></div><div><b>cos</b> ${d}° = adjacente ÷ hipotenusa = ${(10*c).toFixed(2)} ÷ 10 = <b>${c.toFixed(3)}</b></div><div><b>tan</b> ${d}° = oposto ÷ adjacente = ${t==null?'indefinida (adjacente = 0)':(10*s).toFixed(2)+' ÷ '+(10*c).toFixed(2)+' = <b>'+t.toFixed(3)+'</b>'}</div>`}}
function togFm(){labShow=!labShow;$('#fm').style.display=labShow?'block':'none';$('#fb').textContent=labShow?'Ocultar a conta':'Mostrar a conta passo a passo';setLab(labDeg)}

/* ===== Arena (multiplayer via Supabase) ===== */
const T=20000;let A=null;
const RQ=i=>genQ(A.room.seed,i,ARSK[i%ARSK.length]);
function setNick(){const n=($('#nick').value||'').trim().slice(0,14);if(!n){toast('Digite um apelido para entrar');return false}me.nick=n;saveMe();return true}
async function mkRoom(){if(!sb)return toast('Sem conexão com o servidor');if(!setNick())return;const code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
 const r=await sb.from('rooms').insert({code,host_id:me.id,seed:rs(),total:8,state:'lobby',cur:0});if(r.error)return toast('Erro: rode o SQL no Supabase primeiro');
 await sb.from('room_players').insert({room_code:code,player_id:me.id,nick:me.nick,avatar:me.av,score:0});enter(code)}
async function joinRoom(){if(!sb)return toast('Sem conexão com o servidor');if(!setNick())return;const code=($('#code').value||'').toUpperCase().trim(),{data:r}=await sb.from('rooms').select().eq('code',code).maybeSingle();
 if(!r)return toast('Sala não encontrada');if(r.state!='lobby'&&r.host_id!=me.id)return toast('Essa partida já começou');
 await sb.from('room_players').upsert({room_code:code,player_id:me.id,nick:me.nick,avatar:me.av,score:0},{onConflict:'room_code,player_id'});enter(code)}
function enter(code){A={code,room:null,pl:[],my:[],picked:null,t0:0,score:0,sig:''};view='arena';poll();A.iv=setInterval(poll,1800);
 try{A.ch=sb.channel('r'+code).on('postgres_changes',{event:'*',schema:'public',table:'rooms',filter:'code=eq.'+code},poll).on('postgres_changes',{event:'*',schema:'public',table:'room_players',filter:'room_code=eq.'+code},poll).subscribe()}catch(e){}draw()}
async function poll(){if(!A||A.busy)return;A.busy=1;try{const [r,p]=await Promise.all([sb.from('rooms').select().eq('code',A.code).single(),sb.from('room_players').select().eq('room_code',A.code).order('score',{ascending:false})]);if(!A)return;
 if(!r.data){leave();toast('A sala foi encerrada');return}const o=A.room;A.room=r.data;A.pl=p.data||[];
 if(!o||o.state!=A.room.state||o.cur!=A.room.cur){clearInterval(A.tv);if(A.room.state=='q'){A.picked=null;A.t0=Date.now();A.rv=0;A.tv=setInterval(tick,200)}}
 const sig=A.room.state+A.room.cur+A.pl.map(x=>x.player_id+x.score).join();if(sig!=A.sig){A.sig=sig;if(view=='arena')draw(!o||o.state!=A.room.state||o.cur!=A.room.cur)}}catch(e){}if(A)A.busy=0}
function tick(){if(!A||A.room.state!='q')return;const rem=T-(Date.now()-A.t0),b=$('#tb');if(b)b.style.width=Math.max(0,rem/T*100)+'%';if(rem<=0&&A.room.host_id==me.id&&!A.rv){A.rv=1;up({state:'reveal'})}}
const up=o=>Promise.resolve(sb.from('rooms').update(o).eq('code',A.code)).then(poll);
const isHost=()=>A.room&&A.room.host_id==me.id;
function startG(){up({state:'q',cur:0})}function revealQ(){A.rv=1;up({state:'reveal'})}function nextQ(){const r=A.room;r.cur+1>=r.total?up({state:'done'}):up({state:'q',cur:r.cur+1})}
async function aa(k){if(A.picked!=null||A.room.state!='q')return;const ms=Date.now()-A.t0;if(ms>T)return;const q=RQ(A.room.cur),ok=k==q.a,pts=ok?100+Math.round(50*(1-ms/T)):0;A.picked=k;A.score+=pts;A.my.push({sk:q.sk,ok});rec(q.sk,ok);draw(false);
 await sb.from('answers').insert({room_code:A.code,player_id:me.id,q_index:A.room.cur,skill:q.sk,correct:ok,ms,points:pts});await sb.from('room_players').update({score:A.score}).eq('room_code',A.code).eq('player_id',me.id)}
function leave(){if(A){clearInterval(A.iv);clearInterval(A.tv);try{sb.removeChannel(A.ch)}catch(e){}A=null}go('arena')}
const board=n=>A.pl.slice(0,n||99).map((p,i)=>`<div class="rk ${p.player_id==me.id?'me':''}" style="animation-delay:${i*50}ms"><b>${i+1}</b><span>${esc(p.avatar||'🙂')}</span><span>${esc(p.nick)}</span><em>${p.score}</em></div>`).join('');
function pickAv(a){me.av=a;saveMe();draw(false)}

/* ===== Telas ===== */
const V={
home(){const nx=M.findIndex((m,i)=>(P.dn[i]||0)<60),t=Object.values(P.sk).reduce((a,s)=>({ok:a.ok+s.ok,n:a.n+s.n}),{ok:0,n:0});
 return `<div class="card hero"><span class="pill">Entenda. Experimente. Desafie-se.</span><h1>Olá${me.nick?', '+esc(me.nick):''}! 👋</h1><p class="mu">Aprenda seno, cosseno e tangente mexendo em triângulos de verdade e jogando com seus colegas.</p><div class="row"><button class="btn" onclick="go('lab')">📐 Abrir laboratório</button><button class="btn ghost" onclick="go('arena')">⚔️ Entrar na Arena</button></div></div>
 <div class="grid3"><div class="card stat"><b>${P.xp}</b>XP</div><div class="card stat"><b>${Object.keys(P.dn).filter(k=>P.dn[k]>=60).length}/5</b>missões</div><div class="card stat"><b>${t.n?Math.round(t.ok/t.n*100)+'%':'—'}</b>acertos</div></div>
 <div class="card"><h3>Missão do dia</h3>${nx<0?'<p>Você concluiu todas as missões. Treine seus pontos fracos!</p><button class="btn" onclick="revanche()">Treino personalizado</button>':`<p><b>Missão ${nx+1}:</b> ${M[nx].n}</p><button class="btn" onclick="startM(${nx})">${M[nx].ic} Começar</button>`}</div>`},
lab(){return `<h1>Laboratório</h1><p class="mu">Arraste o ângulo e veja os lados e as razões mudarem em tempo real.</p><div class="card lab"><svg viewBox="0 0 300 235" aria-label="Triângulo retângulo interativo"><path id="lp" fill="rgba(124,92,255,.22)" stroke="none"/><line id="l1" x1="40" y1="200" x2="40" y2="200"/><path id="lr" fill="none" stroke="#a9b0dc" stroke-width="2"/><path id="la" fill="none" stroke="#ff6bd6" stroke-width="3"/>
 <g font-size="14" font-weight="700"><text id="lh" fill="#b49cff" text-anchor="middle">hipotenusa</text><text id="lo" fill="#22d3ee">oposto</text><text id="lc" fill="#ffc46b" text-anchor="middle">adjacente</text><text id="lt" fill="#ff6bd6" font-size="17">α</text></g></svg>
 <div class="row" style="align-items:center;justify-content:space-between"><span class="mu">Ângulo</span><span class="ang" id="ang">35°</span></div>
 <input class="sl" id="sl" type="range" min="0" max="90" value="35" oninput="setLab(this.value)" aria-label="Ângulo">
 <div class="chips">${[0,30,45,60,90].map(d=>`<button class="chip" data-d="${d}" onclick="setLab(${d})">${d}°</button>`).join('')}</div>
 <div class="vals"><div class="val"><small>Seno</small><b id="vs"></b><small>oposto / hip.</small><div class="bar"><i id="bs"></i></div></div><div class="val"><small>Cosseno</small><b id="vc"></b><small>adj. / hip.</small><div class="bar"><i id="bc"></i></div></div><div class="val"><small>Tangente</small><b id="vt"></b><small>oposto / adj.</small><div class="bar"><i id="bt"></i></div></div></div>
 <button class="btn ghost" id="fb" onclick="togFm()">Mostrar a conta passo a passo</button><div class="fm" id="fm" style="display:none"></div>
 <p class="mu" style="font-size:.85rem;margin-top:14px">Em 0° e 90° o triângulo deixa de existir; em 90° a tangente é indefinida.</p></div>`},
trail(){return `<h1>Jornada</h1><p class="mu">Conclua cada missão com 60% ou mais para liberar a próxima.</p>`+M.map((m,i)=>{const lk=i>0&&(P.dn[i-1]||0)<60,b=P.dn[i];return `<button class="card mis ${lk?'lk':''}" ${lk?'disabled':''} onclick="startM(${i})"><span class="ic">${lk?'🔒':m.ic}</span><span><b>Missão ${i+1}</b><br>${m.n}</span><span class="pill">${b!=null?b+'%':lk?'bloqueada':'novo'}</span></button>`}).join('')},
quiz(){const q=Q.qs[Q.i];return qCard(q,Q.i,Q.qs.length,'pk',Q.pk,Q.pk!=null)+(Q.pk!=null?`<button class="btn big" onclick="nx()">${Q.i+1<Q.qs.length?'Continuar':'Ver resultado'}</button>`:'')},
res(){const n=Q.qs.length,p=Math.round(Q.ok/n*100),st=p>=80?3:p>=60?2:p>=30?1:0;return `<div class="card center"><div class="stars">${'⭐'.repeat(st)||'💪'}</div><h1>${p}%</h1><p>${Q.ok} de ${n} acertos${Q.m!=null?(p>=60?' — próxima missão liberada!':' — você precisa de 60% para avançar.'):''}</p><div class="row" style="justify-content:center"><button class="btn" onclick="${Q.m!=null?`startM(${Q.m})`:'revanche()'}">Tentar de novo</button><button class="btn ghost" onclick="go('trail')">Missões</button></div></div>`},
arena(){if(!A)return `<h1>Arena</h1><p class="mu">Crie uma sala e compartilhe o código, ou entre na sala de um colega.</p>${sb?'':'<div class="card">⚠️ Não foi possível carregar o Supabase. Verifique sua conexão.</div>'}
 <div class="card"><h3>Seu perfil</h3><input class="tx" id="nick" maxlength="14" placeholder="Apelido" value="${esc(me.nick)}" autocomplete="off"><div class="avs">${['🦊','🐼','🐙','🦄','🐸','🚀','⚡','🧠'].map(a=>`<button class="chip ${a==me.av?'on':''}" onclick="me.nick=$('#nick').value;pickAv('${a}')">${a}</button>`).join('')}</div></div>
 <div class="card"><h3>Criar sala</h3><p class="mu">8 perguntas, 20 segundos cada. Precisão vale mais que velocidade.</p><button class="btn" onclick="mkRoom()">➕ Criar sala</button></div>
 <div class="card"><h3>Entrar com código</h3><input class="tx" id="code" maxlength="4" placeholder="CÓDIGO" style="text-transform:uppercase;letter-spacing:.3em;text-align:center" autocapitalize="characters" autocomplete="off"><button class="btn" onclick="joinRoom()">Entrar</button></div>`;
 const r=A.room;if(!r)return '<div class="card center"><h2>Conectando…</h2></div>';
 if(r.state=='lobby')return `<div class="card center"><p class="mu">Código da sala</p><div class="code">${A.code}</div><p class="mu">${A.pl.length} jogador(es) conectado(s)</p></div><div class="card"><h3>Jogadores</h3>${board()}</div>${isHost()?`<button class="btn big" onclick="startG()">▶ Começar partida</button>`:'<p class="center mu">Aguardando o anfitrião iniciar…</p>'}<button class="btn ghost big" onclick="leave()">Sair</button>`;
 if(r.state=='q'||r.state=='reveal'){const q=RQ(r.cur),rv=r.state=='reveal';return `<div class="tm"><i id="tb" style="width:${rv?0:100}%"></i></div>${qCard(q,r.cur,r.total,'aa',A.picked,rv,`<p class="mu">Sala ${A.code} · ${A.score} pts</p>`)}${rv?`<div class="card"><h3>Placar</h3>${board(5)}</div>`:A.picked!=null?'<p class="center mu">✓ Resposta enviada. Aguardando os outros…</p>':''}${isHost()?`<button class="btn big" onclick="${rv?'nextQ()':'revealQ()'}">${rv?(r.cur+1>=r.total?'Ver resultado final':'Próxima pergunta'):'Revelar agora'}</button>`:''}`}
 const by={};A.my.forEach(a=>{(by[a.sk]=by[a.sk]||{ok:0,n:0}).n++;if(a.ok)by[a.sk].ok++});
 return `<div class="card center"><div class="stars">🏆</div><h1>Resultado final</h1></div><div class="card">${board()}</div><div class="card"><h3>Sua análise</h3>${Object.keys(by).map(k=>`<div class="sk"><span>${SK[k]}</span><em>${by[k].ok}/${by[k].n}</em><div class="bar"><i style="width:${by[k].ok/by[k].n*100}%"></i></div></div>`).join('')||'<p class="mu">Sem respostas registradas.</p>'}</div><button class="btn big" onclick="leave();revanche()">🔁 Revanche personalizada</button><button class="btn ghost big" onclick="leave()">Sair da sala</button>`},
prog(){const ks=Object.keys(SK),w=weak(),t=Object.values(P.sk).reduce((a,s)=>({ok:a.ok+s.ok,n:a.n+s.n}),{ok:0,n:0});
 return `<h1>Meu progresso</h1><div class="grid3"><div class="card stat"><b>${P.xp}</b>XP</div><div class="card stat"><b>${t.n}</b>respostas</div><div class="card stat"><b>${t.n?Math.round(t.ok/t.n*100)+'%':'—'}</b>acertos</div></div>
 <div class="card"><h3>Domínio por assunto</h3>${ks.map(k=>{const a=acc(k),n=(P.sk[k]||{}).n||0;return `<div class="sk"><span>${SK[k]}</span><em>${a==null?'sem dados':Math.round(a*100)+'% · '+n+' resp.'}</em><div class="bar"><i style="width:${a==null?0:a*100}%"></i></div></div>`}).join('')}</div>
 <div class="card"><h3>Revisão recomendada</h3>${w.length?`<p>Reforce: <b>${w.map(k=>SK[k]).join(', ')}</b>.</p><div class="row"><button class="btn" onclick="revanche()">Treino personalizado</button><button class="btn ghost" onclick="go('lab')">Rever no laboratório</button></div>`:'<p>Nenhuma dificuldade detectada ainda. Continue praticando!</p>'}</div>
 <button class="btn ghost" onclick="if(confirm('Zerar todo o progresso deste aparelho?')){P={xp:0,sk:{},dn:{}};saveP();draw()}">Zerar progresso</button>`}};

/* ===== Navegação e renderização ===== */
const NAV=[['home','🏠','Início'],['lab','📐','Laboratório'],['trail','🗺️','Missões'],['arena','⚔️','Arena'],['prog','📈','Progresso']];
let view='home';
function draw(a=true){const v=$('#v');v.innerHTML=V[view]();v.classList.remove('in');if(a){void v.offsetWidth;v.classList.add('in')}
 const on={quiz:'trail',res:'trail'}[view]||view;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==on));
 if(view=='lab')setLab(labDeg);if(view=='arena'&&A&&A.room&&A.room.state=='q')tick()}
function go(v){if(A&&v!='arena'&&v!='quiz')leave_();view=v;draw();scrollTo({top:0,behavior:'smooth'})}
function leave_(){clearInterval(A.iv);clearInterval(A.tv);try{sb.removeChannel(A.ch)}catch(e){}A=null}
function leave(){if(A)leave_();view='arena';draw()}
$('#nav').innerHTML='<div class="brand">TriGo</div>'+NAV.map(n=>`<button data-v="${n[0]}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');
draw();
</script>
</body>
</html>
